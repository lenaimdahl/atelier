name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/backend/go.mod
          cache: true

      - name: Verify generated models are up to date
        working-directory: packages/backend
        run: |
          go generate ./...
          git add -A
          git diff --cached --exit-code

      - name: Check formatting
        working-directory: packages/backend
        run: test -z "$(gofmt -l .)"

      - name: Test
        working-directory: packages/backend
        run: go test ./...

      - name: Static checks
        working-directory: packages/backend
        run: go vet ./...

  frontend:
    name: Frontend checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated model types are up to date
        run: |
          pnpm --filter atelier generate:types
          git add -A -- packages/frontend/src/types/generated
          git diff --cached --exit-code -- packages/frontend/src/types/generated

      - name: Verify generated API client is up to date
        run: |
          pnpm --filter atelier generate:api-client
          git add -A -- packages/frontend/src/api/generated
          git diff --cached --exit-code -- packages/frontend/src/api/generated

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4

  secret-scan:
    name: Secret scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint_frontend_dockerfile:
    name: Lint frontend Dockerfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        with:
          dockerfile: packages/frontend/Dockerfile

  lint_backend_dockerfile:
    name: Lint backend Dockerfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
        with:
          dockerfile: packages/backend/Dockerfile

  build_frontend_dockerfile:
    name: Build frontend Docker image
    needs: frontend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: false

  build_backend_dockerfile:
    name: Build backend Docker image
    needs: backend
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: packages/backend
          file: packages/backend/Dockerfile
          push: false

  test_nginx_config:
    name: Test nginx config
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: nginx:1.31.3-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate and validate nginx config
        run: |
          cp packages/frontend/nginx.conf /etc/nginx/conf.d/default.conf
          nginx -t

  deploy_frontend:
    name: Deploy latest frontend image
    needs:
      - build_frontend_dockerfile
      - test_nginx_config
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      deployments: write
    steps:
      - name: Deploy
        uses: ffflorian/actions/coolify-deploy@c3ebe9a46aca0870e964c6c07bbd38395515d095
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          environment: frontend-production
          domain: ${{ secrets.COOLIFY_DOMAIN }}
          token: ${{ secrets.COOLIFY_TOKEN }}
          uuid: ${{ secrets.COOLIFY_UUID_FRONTEND }}

  deploy_backend:
    name: Deploy latest backend image
    needs:
      - build_backend_dockerfile
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      deployments: write
    steps:
      - name: Deploy
        uses: ffflorian/actions/coolify-deploy@c3ebe9a46aca0870e964c6c07bbd38395515d095
        with:
          environment: backend-production
          domain: ${{ secrets.COOLIFY_DOMAIN }}
          token: ${{ secrets.COOLIFY_TOKEN }}
          uuid: ${{ secrets.COOLIFY_UUID_BACKEND }}
