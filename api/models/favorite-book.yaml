$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "favorite-book.yaml"
title: FavoriteBook
description: A book on the shared shelf, with how often visitors picked it.
type: object
properties:
  book:
    $ref: "book.yaml"
  count:
    type: integer
    description: Number of visitors who picked this book as a favorite.
  lastAddedAt:
    type: string
    format: date-time
    description: >-
      RFC 3339 timestamp in UTC of the latest pick. The frontend converts this
      to UTC+1 for display, per AGENTS.md section 13.
required:
  - book
  - count
  - lastAddedAt
additionalProperties: false
