$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "book.yaml"
title: Book
description: A book from the Atelier library, imported from the Open Library API.
type: object
properties:
  id:
    type: string
    description: Open Library work ID of the book, e.g. "OL675783W".
  title:
    type: string
    description: Title of the book.
  author:
    type: string
    description: Author of the book.
  language:
    type: string
    enum:
      - en
      - de
    description: Language of the book.
  coverUrl:
    type: string
    description: >-
      Path of the cover image, relative to the API base URL, e.g.
      "/covers/OL675783W". The backend serves the covers it imported from Open
      Library, so browsers never contact Open Library.
required:
  - id
  - title
  - author
  - language
additionalProperties: false
