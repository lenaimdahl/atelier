services:
  postgres:
    image: postgres:17-alpine
    container_name: marginalia-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-password
      POSTGRES_DB: marginalia_db
    ports:
      - "5432:5432"
    volumes:
      - marginalia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marginalia_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./packages/backend
    container_name: atelier-backend
    environment:
      DATABASE_URL: postgres://postgres:your-password@postgres:5432/marginalia_db
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: atelier-frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  marginalia_pgdata:
